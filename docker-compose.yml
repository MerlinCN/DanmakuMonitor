services:
  dmk_m_frontend:
    platform: linux/amd64
    build:
      context: /Users/merlin/BiliDanmuWeb
      dockerfile: Dockerfile
    volumes:
      - frontend_dist:/app/dist

  dmk_m_backend:
    platform: linux/amd64
    build: .
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=dmk_m_redis
      - DATABASE_HOST=host.docker.internal
    volumes:
      - frontend_dist:/app/backend/dist:ro
    depends_on:
      dmk_m_frontend:
        condition: service_completed_successfully
      dmk_m_redis:
    restart: unless-stopped

  dmk_m_redis:
    image: redis:latest
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  redis_data:
  frontend_dist:
